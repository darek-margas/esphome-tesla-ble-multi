name: Release multi-car

on:
  push:
    branches:
      - multicar-v2
    paths:
      - VERSION
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout multicar-v2
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0
        with:
          ref: multicar-v2
          fetch-depth: 0

      - name: Run unit tests
        run: make test

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          test -n "$VERSION"
          TAG="v$VERSION"

          cat > /tmp/release-notes.md <<'EOF'
          ## Quieter log: car hand-overs and late replies no longer warn

          Firmware change only: rebuild and flash. No YAML change needed, unless your own YAML pins the library:

          ```yaml
          esp32:
            framework:
              components:
                - name: tesla-ble
                  source: https://github.com/darek-margas/tesla-ble.git
                  ref: v5.2.0-dm.9   # roll back: v5.2.0-dm.8
          ```

          ### Changed
          - **A planned BLE hand-over between cars logs at DEBUG.** With two cars, every turn change logged *BLE connection closed* and *BLE disconnected* as warnings, about four lines a minute, so a real drop was hard to spot at a WARN-level logger. A hand-over now shows at DEBUG with *(hand-over)*; an unplanned drop still warns.
          - **A late reply from the car logs at DEBUG** (library dm.9). A reply to a request that was already resent or given up on is dropped, as before, and the command still reports its own result.

          ### Library dm.9
          - Tests also run against Mbed TLS 4 (ESP-IDF 6), and the library's full CI now runs on its `multicar` branch. No change to commands, sessions or stored keys.

          ### Thanks
          Both log changes and the Mbed TLS 4 tests are by @davidcoulson.

          Library: [darek-margas/tesla-ble](https://github.com/darek-margas/tesla-ble) `v5.2.0-dm.9` ([release notes](https://github.com/darek-margas/tesla-ble/releases/tag/v5.2.0-dm.9)).
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "ESPHome Tesla BLE multi-car $TAG" \
              --notes-file /tmp/release-notes.md
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "ESPHome Tesla BLE multi-car $TAG" \
              --notes-file /tmp/release-notes.md
          fi
