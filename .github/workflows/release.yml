name: Release multi-car

on:
  push:
    branches:
      - multicar-v2
    paths:
      - VERSION
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout multicar-v2
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0
        with:
          ref: multicar-v2
          fetch-depth: 0

      - name: Run unit tests
        run: make test

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          test -n "$VERSION"
          TAG="v$VERSION"

          cat > /tmp/release-notes.md <<'EOF'
          ## Present no longer flickers while the cars take turns

          Firmware change: rebuild and flash. Same library, [darek-margas/tesla-ble](https://github.com/darek-margas/tesla-ble) `v5.2.0-dm.3`, no YAML change needed.

          ### Changed
          - **Present** turns to away only after the car was neither connected nor heard for **5 minutes**. It used the same 60 s window as the BLE turn decision, so a car whose adverts the scanner missed for a minute, while the other car held the link, flipped to away and back. Turns still use 60 s, so a car that has left stops getting turns quickly.
          - New per-car option **`presence_timeout`** (default `5min`, 1 min – 1 h) if you want it shorter or longer:
            ```yaml
            tesla_ble_vehicle:
              - id: car_one
                presence_timeout: 10min
            ```
          - After a reboot, Present waits a minute for the car's first advert before it reports away, so a restart no longer shows away → home.
          - **BLE Advert RSSI** still goes unknown after 60 s without an advert, as before.

          ### Also
          - CI and `make` builds use ESPHome **2026.9.1**.

          Library: [darek-margas/tesla-ble](https://github.com/darek-margas/tesla-ble) `v5.2.0-dm.3` ([release notes](https://github.com/darek-margas/tesla-ble/releases/tag/v5.2.0-dm.3)).
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "ESPHome Tesla BLE multi-car $TAG" \
              --notes-file /tmp/release-notes.md
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "ESPHome Tesla BLE multi-car $TAG" \
              --notes-file /tmp/release-notes.md
          fi
