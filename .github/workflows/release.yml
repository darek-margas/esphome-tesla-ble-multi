name: Release multi-car

on:
  push:
    branches:
      - multicar-v2
    paths:
      - VERSION
      - CHANGELOG.md
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout multicar-v2
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0
        with:
          ref: multicar-v2
          fetch-depth: 0

      - name: Run unit tests
        run: make test

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          test -n "$VERSION"
          TAG="v$VERSION"

          # Notes come from CHANGELOG.md: the "## <version> — <title>" section, with the
          # title as its heading.
          notes() {
            awk -v v="$1" '
              /^## / { if (found) exit; if ($2 == v) { found = 1; sub(/^## [^ ]+ +(— +)?/, "## "); print; next } }
              found { print }
              END { if (!found) exit 1 }
            ' CHANGELOG.md
          }

          notes "$VERSION" > /tmp/release-notes.md || {
            echo "::error::CHANGELOG.md has no '## $VERSION' section"
            exit 1
          }

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "ESPHome Tesla BLE multi-car $TAG" \
              --notes-file /tmp/release-notes.md
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "ESPHome Tesla BLE multi-car $TAG" \
              --notes-file /tmp/release-notes.md
          fi

          # Keep the notes of earlier releases listed in the changelog in step with it.
          for v in $(grep -oP '^## \K[0-9][^ ]*' CHANGELOG.md); do
            [ "$v" = "$VERSION" ] && continue
            gh release view "v$v" >/dev/null 2>&1 || continue
            notes "$v" > /tmp/old-notes.md
            gh release edit "v$v" --notes-file /tmp/old-notes.md
          done
