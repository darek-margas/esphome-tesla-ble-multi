name: Release multi-car

on:
  push:
    branches:
      - multicar-v2
    paths:
      - VERSION
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout multicar-v2
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0
        with:
          ref: multicar-v2
          fetch-depth: 0

      - name: Run unit tests
        run: make test

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          test -n "$VERSION"
          TAG="v$VERSION"

          cat > /tmp/release-notes.md <<'EOF'
          ## Refactoring: remove code made redundant by the one-link-at-a-time design

          No new features and no configuration changes. v2026.10.0 moved to one BLE link at a time (cars take turns). Several parts of the code only existed to keep two simultaneously connected cars from competing, and they are now removed or simplified:

          - **Dead code removed:** an unused constant (`USER_COMMAND_QUIET_MS`) and a stored RSSI value that was never read.
          - **No 350 ms pause after each infotainment command.** It gave the other car's link room while both were connected. Now it only slowed every poll batch by about 1.75 s.
          - **Infotainment work queue is per car** instead of shared across all cars. Each car still has one command in flight, user commands go ahead of background polls, and user commands are re-queued if the link drops. Queued work starts when the car's turn begins.
          - **BLE write state is per link.** The ESP32-wide write lock and shared pacing timer are gone. Pacing is now kept per car, and resetting it no longer misbehaves after 24.8 days of uptime.
          - **Quieter logs:** the BLE link parameters line moved from INFO to DEBUG.

          Tested on two cars: turn hand-over, polling while both cars sleep (no wake-ups), and a command to a sleeping car (wake, then command).

          Library unchanged: [darek-margas/tesla-ble](https://github.com/darek-margas/tesla-ble) `v5.2.0`. See v2026.10.0 for the multi-car design.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "ESPHome Tesla BLE multi-car $TAG" \
              --notes-file /tmp/release-notes.md
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "ESPHome Tesla BLE multi-car $TAG" \
              --notes-file /tmp/release-notes.md
          fi
