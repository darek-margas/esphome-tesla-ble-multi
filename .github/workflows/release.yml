name: Release multi-car

on:
  push:
    branches:
      - multicar-v2
    paths:
      - VERSION
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout multicar-v2
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0
        with:
          ref: multicar-v2
          fetch-depth: 0

      - name: Run unit tests
        run: make test

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          test -n "$VERSION"
          TAG="v$VERSION"

          cat > /tmp/release-notes.md <<'EOF'
          ## Media player fixes, tested on the cars

          Follow-up to 2026.10.5.1 (media player). Same library, [darek-margas/tesla-ble](https://github.com/darek-margas/tesla-ble) `v5.2.0-dm.3`: no YAML change if you are already on 2026.10.5.1.

          ### Changed
          - **Media** (media player) no longer offers next / previous track. Home Assistant shows those arrows for ESPHome media players but has no handler for them, so pressing them gave an error. Use the **Media Next Track** / **Media Previous Track** buttons, or the combined player below.
          - **Media Source** shows a source that Tesla's protocol file does not name by its number, e.g. *Source 27*, which the cars report for streamed music. It used to stay empty.
          - Each media poll logs what the car sent: `Media reported: status=… volume=… max=… source=… title=… bytes artist=… bytes` (`-1` = not sent).

          ### One player in Home Assistant
          ESPHome media players carry no titles, and Home Assistant's ESPHome integration has no next / previous. A [universal media player](https://www.home-assistant.io/integrations/universal/) combines the player, the track buttons and the text sensors into one entity with working arrows and now playing. The example is in the [README](https://github.com/darek-margas/esphome-tesla-ble-multi#a-car-in-home-assistant): one per car, check your entity ids, show it with a *Media control* card.

          ### Tested on the cars
          - Play / pause and next / previous track; volume read back.
          - Titles and artists, including Polish characters.
          - YouTube in the car's theater: source *Theater*, the video title as *Media Title*, no artist.
          - While the car sleeps the player shows *Off*, and media commands are not sent (they never wake the car).
          - Not tested yet: setting the volume from Home Assistant, and Netflix / Disney+ actually playing.

          Library: [darek-margas/tesla-ble](https://github.com/darek-margas/tesla-ble) `v5.2.0-dm.3` ([release notes](https://github.com/darek-margas/tesla-ble/releases/tag/v5.2.0-dm.3)).
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "ESPHome Tesla BLE multi-car $TAG" \
              --notes-file /tmp/release-notes.md
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "ESPHome Tesla BLE multi-car $TAG" \
              --notes-file /tmp/release-notes.md
          fi
