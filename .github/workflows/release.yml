name: Release multi-car

on:
  push:
    branches:
      - multicar-v2
    paths:
      - VERSION
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout multicar-v2
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0
        with:
          ref: multicar-v2
          fetch-depth: 0

      - name: Run unit tests
        run: make test

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          test -n "$VERSION"
          TAG="v$VERSION"

          cat > /tmp/release-notes.md <<'EOF'
          ## Clearer entities in Home Assistant

          How the cars' state is shown in Home Assistant, plus documentation. No change to the BLE link or polling.

          ### Doors, windows and odometer enabled, with state icons
          - **Door** (4), **Window** (4) and **Odometer** are now enabled by default. Doors follow VCSEC, so they stay correct while the car sleeps. Sunroof stays disabled (rarely used).
          - Doors and windows no longer force a fixed car-door icon. With their `door` / `window` device class Home Assistant now shows an open or closed door / window icon and colours it when open (the windows were showing a door icon before).

          Entities that already exist in Home Assistant keep their enabled/disabled setting - enable them once under the car's device page. New installs get them enabled.

          ### Seat heaters show Running / Not running
          - **Seat Heater Front Left / Front Right** are now binary sensors with device class `running`: *Running* when heating at any level. Rear seats work the same, disabled by default.
          - The Off / Low / Medium / High level moved to **Seat Heater … Level** sensors, disabled by default.
          - The steering wheel heater stays the **Heated Steering** switch (it is a control; Home Assistant shows switches as On / Off).

          ### Sentry Mode Available folded into the Sentry Mode switch
          The separate **Sentry Mode Available** entity is removed. The car's flag is still read: when the car reports sentry mode is not available, the **Sentry Mode** switch refuses to turn on and flips back, with a log line saying why.

          ### Battery Heater No Power shows OK
          The car sends this flag only when the problem occurs, so the sensor stayed unknown. It now shows *OK* when the car reports a battery heater state without the flag, and *Problem* only when the car reports it.

          ### Documentation
          - README and `tesla-ble.example.yml` use generic car names only.
          - `wake_on_boot` is shown per car in both examples (one car `true`, one `false`) and the README explains what it does and when to turn it off for a car.

          ### After updating
          Home Assistant will list **Sentry Mode Available** and the old **Seat Heater Front Left / Front Right** text sensors as unavailable - delete them.

          Library unchanged: [darek-margas/tesla-ble](https://github.com/darek-margas/tesla-ble) `v5.2.0`.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "ESPHome Tesla BLE multi-car $TAG" \
              --notes-file /tmp/release-notes.md
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "ESPHome Tesla BLE multi-car $TAG" \
              --notes-file /tmp/release-notes.md
          fi
