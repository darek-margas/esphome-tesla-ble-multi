name: Release multi-car

on:
  push:
    branches:
      - multicar-v2
    paths:
      - VERSION
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout multicar-v2
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0
        with:
          ref: multicar-v2
          fetch-depth: 0

      - name: Run unit tests
        run: make test

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          test -n "$VERSION"
          TAG="v$VERSION"

          cat > /tmp/release-notes.md <<'EOF'
          ## Cleanup: upstream leftovers removed

          No firmware change: a device on 2026.10.6 behaves the same after updating. Same library, [darek-margas/tesla-ble](https://github.com/darek-margas/tesla-ble) `v5.2.0-dm.3`.

          ### Removed
          - **ESPHome Device Builder adopt / import.** The `*.dashboard.yml` files and their packages came from the original project and still pointed at yoziru/esphome-tesla-ble, so adopting a device through the dashboard installed the original single-car code, not this one. Install with your own YAML and the external component, as in the [README](https://github.com/darek-margas/esphome-tesla-ble-multi#external-component).
          - The `dashboard_import` lines in the board files, the `make validate-dashboard-config` target and the old upstream release script (`scripts/release.sh`). Releases come from the GitHub workflow.

          ### Changed
          - `tesla-ble.example.yml` takes the components from this repository instead of the upstream one.

          If you adopted a device through the dashboard earlier, it is running the upstream code: switch its YAML to the README example to get this project.

          Library: [darek-margas/tesla-ble](https://github.com/darek-margas/tesla-ble) `v5.2.0-dm.3` ([release notes](https://github.com/darek-margas/tesla-ble/releases/tag/v5.2.0-dm.3)).
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "ESPHome Tesla BLE multi-car $TAG" \
              --notes-file /tmp/release-notes.md
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "ESPHome Tesla BLE multi-car $TAG" \
              --notes-file /tmp/release-notes.md
          fi
