name: Release multi-car

on:
  push:
    branches:
      - multicar-v2
    paths:
      - VERSION
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout multicar-v2
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0
        with:
          ref: multicar-v2
          fetch-depth: 0

      - name: Run unit tests
        run: make test

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          test -n "$VERSION"
          TAG="v$VERSION"

          cat > /tmp/release-notes.md <<'EOF'
          ## Media player: play / pause, volume, track skip and now playing

          Control the car's media from Home Assistant. This needs the Tesla BLE library fork **[darek-margas/tesla-ble](https://github.com/darek-margas/tesla-ble) `v5.2.0-dm.3`**, which adds the media controls and the media state read.

          ### ⚠️ Change your YAML: library `v5.2.0-dm.3`
          If your own YAML lists the `tesla-ble` component (instead of taking it from `packages/board.yml`), change it to:

          ```yaml
          esp32:
            framework:
              components:
                - name: tesla-ble
                  source: https://github.com/darek-margas/tesla-ble.git
                  ref: v5.2.0-dm.3   # roll back: v5.2.0-dm.2
          ```

          With an older library the build stops with an error at `set_media_state_callback`. That error is the check telling you the library is too old.

          ### New entities per car
          - **Media** (media player): play / pause and volume. Both are read back from the car.
            - Volume maps to the car's 0–10 scale.
            - Volume up / down moves one step.
          - **Media Title**, **Media Artist** and **Media Source** (text sensors). ESPHome media players cannot carry titles, so these are separate entities. They are empty while nothing plays.
          - **Media Next Track** and **Media Previous Track** (buttons). Home Assistant's ESPHome integration has no next / previous track command.

          ### When it is read, and the car's sleep
          - The media state is read with each infotainment poll while the car is awake, and again 1.5 s after every media command.
          - While the car sleeps the player shows *Off* and the now-playing sensors are cleared.
          - Media commands are never sent to a sleeping car, so they never wake it. Media is for someone sitting in the car.

          ### Also in this release
          - Infotainment batches count the media poll before any job is queued, so a batch cannot be marked complete early.

          Library: [darek-margas/tesla-ble](https://github.com/darek-margas/tesla-ble) `v5.2.0-dm.3` ([release notes](https://github.com/darek-margas/tesla-ble/releases/tag/v5.2.0-dm.3)).
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "ESPHome Tesla BLE multi-car $TAG" \
              --notes-file /tmp/release-notes.md
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "ESPHome Tesla BLE multi-car $TAG" \
              --notes-file /tmp/release-notes.md
          fi
