name: Release multi-car

on:
  push:
    branches:
      - multicar-v2
    paths:
      - VERSION
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout multicar-v2
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0
        with:
          ref: multicar-v2
          fetch-depth: 0

      - name: Run unit tests
        run: make test

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          test -n "$VERSION"
          TAG="v$VERSION"

          cat > /tmp/release-notes.md <<'EOF'
          ## Fix: locks stuck on Locking / Unlocking; no doubled car names

          Two fixes on top of v2026.10.4.1.

          ### Charge Port Latch (and Doors) no longer stick on Locking / Unlocking
          The **Charge Port Latch** lock moves the charge port flap (Lock closes it, Unlock opens it and releases a cable), but its state comes from the cable latch. After a click it showed *Locking* / *Unlocking* and waited for a poll to report something else, which went wrong two ways:
          - nothing re-read the state after the command, and with an idle car the next charge poll can be 11 minutes away;
          - with no cable plugged in the car reports the latch as "not available", which was ignored - so the entity stayed *Locking* / *Unlocking* for good while the flap had long finished moving.

          Now:
          - after a lock / unlock command the state is read again (charge state after 1.5 s and 8 s for the latch, VCSEC after 2 s for the doors). If the command fails or nothing new arrives within 20 s, the entity returns to the last state the car reported.
          - the latch shows *Locked* (cable held), *Unlocked* (cable free) or *Jammed*; with **no cable** it follows the charge port flap: closed = *Locked*, open = *Unlocked*.

          ### No doubled car names
          With a Home Assistant sub-device per car (`device_id`), Home Assistant puts the device name in front of every entity name, and the entity name already started with the car name - giving names like "Car One Car One Charge Port Latch". Entities on a car's own device are now named without the car name ("Car One Charge Port Latch"). Without `device_id` nothing changes. ESPHome keys entities per device, so equal names on two cars do not collide.

          **After updating (only with `device_id`):** the entity names are part of each entity's identity, so Home Assistant creates **new entities** with shorter IDs (for example `lock.car_one_charge_port_latch`) and the old ones show as unavailable.
          - Delete the old, unavailable entities (Settings → Entities, filter by status).
          - Update automations, scripts and dashboards that use the old entity IDs - or, after deleting an old entity, rename the new entity's ID back to the old one.
          - History starts fresh on the new entities.

          Library unchanged: [darek-margas/tesla-ble](https://github.com/darek-margas/tesla-ble) `v5.2.0`.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "ESPHome Tesla BLE multi-car $TAG" \
              --notes-file /tmp/release-notes.md
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "ESPHome Tesla BLE multi-car $TAG" \
              --notes-file /tmp/release-notes.md
          fi
