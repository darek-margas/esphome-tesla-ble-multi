name: Release multi-car

on:
  push:
    branches:
      - multicar-v2
    paths:
      - VERSION
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout multicar-v2
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0
        with:
          ref: multicar-v2
          fetch-depth: 0

      - name: Run unit tests
        run: make test

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          test -n "$VERSION"
          TAG="v$VERSION"

          cat > /tmp/release-notes.md <<'EOF'
          ## Fix: climate preset now shows "Normal"

          Small fix on top of v2026.10.3.

          The climate entity reads its preset back from the car (Normal / Keep On / Dog Mode / Camp Mode / Defrost), but it stayed blank. Logs from two cars showed why: when no climate keeper mode is active, the car reports the keeper mode as "Unknown" (with defrost "Off"), not "Off". The preset now shows **Normal** in that case. Keep On, Dog Mode and Camp Mode still show when the car reports them, and Defrost when max defrost is on.

          Confirmed working in v2026.10.3 on the same cars: climate turned on from the Tesla app shows up in Home Assistant on the car's next BLE turn (`Car woke up - reading its state once`), instead of up to 11 minutes later.

          See v2026.10.3 for the other changes in this series. Library unchanged: [darek-margas/tesla-ble](https://github.com/darek-margas/tesla-ble) `v5.2.0`.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "ESPHome Tesla BLE multi-car $TAG" \
              --notes-file /tmp/release-notes.md
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "ESPHome Tesla BLE multi-car $TAG" \
              --notes-file /tmp/release-notes.md
          fi
