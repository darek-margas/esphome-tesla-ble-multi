name: Release multi-car

on:
  push:
    branches:
      - multicar-v2
    paths:
      - VERSION
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout multicar-v2
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0
        with:
          ref: multicar-v2
          fetch-depth: 0

      - name: Run unit tests
        run: make test

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          test -n "$VERSION"
          TAG="v$VERSION"

          cat > /tmp/release-notes.md <<'EOF'
          ## Quieter warnings: no Bluetooth noise on hand-over, no lasting warning while a car is away

          Firmware change only: rebuild and flash. Same library, [darek-margas/tesla-ble](https://github.com/darek-margas/tesla-ble) `v5.2.0-dm.9`, no YAML change needed.

          ### Changed
          - **The Bluetooth stack logs errors only at its HCI layer.** With two cars, every planned hand-over logged two warnings from ESP-IDF's Bluetooth stack, `BT_HCI: hci cmd send: disconnect` and `hcif disc complete`. They were normal disconnects, but they made real problems harder to spot. The component now sets `CONFIG_BT_LOG_HCI_TRACE_LEVEL_ERROR`, so real Bluetooth errors still show. If you added this option to your own YAML, you can remove it.

          ### Fixed
          - **The device no longer stays in warning status while a car is away.** A car that drove off during its BLE turn set the warning *BLE connection lost*, and only its next connection cleared it, so the device showed a warning for as long as the car was gone. The warning is now cleared when the car is marked not present (after `presence_timeout`, default 5 minutes). The log still shows the drop itself as a warning.

          Library: [darek-margas/tesla-ble](https://github.com/darek-margas/tesla-ble) `v5.2.0-dm.9` ([release notes](https://github.com/darek-margas/tesla-ble/releases/tag/v5.2.0-dm.9)).
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "ESPHome Tesla BLE multi-car $TAG" \
              --notes-file /tmp/release-notes.md
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "ESPHome Tesla BLE multi-car $TAG" \
              --notes-file /tmp/release-notes.md
          fi
