name: Release multi-car

on:
  push:
    branches:
      - multicar-v2
    paths:
      - VERSION
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout multicar-v2
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0
        with:
          ref: multicar-v2
          fetch-depth: 0

      - name: Run unit tests
        run: make test

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          test -n "$VERSION"
          TAG="v$VERSION"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi

          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "ESPHome Tesla BLE multi-car $TAG" \
            --notes "Multi-car release from the multicar-v2 branch.

- Multiple Teslas from one ESP32
- Separate BLE client, private key and Tesla sessions per VIN
- Home Assistant sub-device per vehicle
- Independent pairing and key regeneration
- CLOUD_KEY pairing for software keys
- Global BLE GATT write serialization across vehicles
- Parent BLE radio and restart controls supported
- ESPHome 2026.9.x / Tesla BLE library v5.2.0

The main branch remains reserved for tracking upstream yoziru/esphome-tesla-ble changes."
