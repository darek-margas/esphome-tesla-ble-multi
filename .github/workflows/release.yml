name: Release multi-car

on:
  push:
    branches:
      - multicar-v2
    paths:
      - VERSION
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout multicar-v2
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0
        with:
          ref: multicar-v2
          fetch-depth: 0

      - name: Run unit tests
        run: make test

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          test -n "$VERSION"
          TAG="v$VERSION"

          cat > /tmp/release-notes.md <<'EOF'
          ## Scheduled departure, Cabin Overheat temperature, Low Power / Keep Accessory / Guest Mode

          New controls that were missing compared with the Tesla app. They need new actions in the Tesla BLE library, so this release moves to the library fork **[darek-margas/tesla-ble](https://github.com/darek-margas/tesla-ble) `v5.2.0-dm.2`**.

          ### ⚠️ Change your YAML: library `v5.2.0-dm.2`
          If your config pins the library itself (instead of using `packages/board.yml`), change it to:

          ```yaml
          external_components:
            - source:
                type: git
                url: https://github.com/darek-margas/tesla-ble.git
                ref: v5.2.0-dm.2   # roll back: v5.2.0-dm.1
          ```

          An older library now fails the build with a clear error at `set_scheduled_departure` instead of building firmware where the new controls do nothing (seen as `Unsupported vehicle action type: 66` in the log).

          ### Cabin Overheat Protection: one select with the temperature
          As in the Tesla app, a single select: **Off / Fan Only / On 30 °C / On 35 °C / On 40 °C**, read back from the car. The icon is now a snowflake thermometer (cooling) instead of the defroster, also on *Cabin Overheat Active*. The separate *Cabin Overheat Temperature* select is gone.

          ### Scheduled departure
          - **Scheduled Departure** (switch)
          - **Scheduled Departure Time** (time picker; setting a time also turns departure on)
          - **Departure Preconditioning** and **Departure Off-Peak Charging** (Off / All Week / Weekdays)
          - **Off-Peak End Time** (time picker)

          All of these are read back from the car's charge state. Each change sends the whole schedule, built from what the car last reported, then reads it back. The old *Scheduled Departure Time* text sensor is replaced by the time picker. *Not yet tested on the cars; please report if something does not stick.*

          ### Low Power Mode, Keep Accessory Power, Guest Mode
          New switches. The car does not report these over BLE, so they are **assumed state**: Home Assistant shows what was last sent, with separate On / Off buttons.

          ### Clean up in Home Assistant
          These entities are now *unavailable* and can be deleted: **Cabin Overheat Temperature** and the old **Scheduled Departure Time** text sensor.

          Library: [darek-margas/tesla-ble](https://github.com/darek-margas/tesla-ble) `v5.2.0-dm.2` (upstream yoziru v5.2.0 plus guest mode, cabin overheat temperature, low power / keep accessory power and scheduled departure).
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "ESPHome Tesla BLE multi-car $TAG" \
              --notes-file /tmp/release-notes.md
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "ESPHome Tesla BLE multi-car $TAG" \
              --notes-file /tmp/release-notes.md
          fi
