name: Release multi-car

on:
  push:
    branches:
      - multicar-v2
    paths:
      - VERSION
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout multicar-v2
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0
        with:
          ref: multicar-v2
          fetch-depth: 0

      - name: Run unit tests
        run: make test

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          test -n "$VERSION"
          TAG="v$VERSION"

          cat > /tmp/release-notes.md <<'EOF'
          ## Charge Port Latch settles reliably; car name in lock / cover log lines

          Follow-up to v2026.10.4.2, from testing the Charge Port Latch on a car without a cable.

          ### The car keeps its BLE turn 10 s after a command
          After a lock / unlock the state is read again 1.5 s and 8 s later to confirm it. In a log the car handed the BLE link to the other car before the 8 s read, so a wrong early reading stayed on screen until that car's next turn. After any command sent from Home Assistant the car now keeps its turn for 10 s (the 60 s maximum turn still applies), so the follow-up reads always run.

          ### Charge Port Latch follows the flap when no cable is connected
          Right after the flap opened, the car briefly reported the latch pin as engaged - with no cable - so the lock showed *Locked* although the flap was open. Without a cable the latch means nothing, so whenever the charging state says no cable is connected, the lock now follows the charge port flap: open = *Unlocked*, closed = *Locked*. With a cable plugged in, the real latch still decides (*Locked* = cable held, *Unlocked* = cable free, *Jammed*).

          ### Lock and cover changes logged with the car name
          Since v2026.10.4.2 entity names on a car's own device leave out the car name, so the `[S]` state lines in the ESPHome log viewer (printed by the viewer from the entity name) no longer say which car. The firmware now logs each change of the Doors and Charge Port Latch locks and the Trunk, Frunk, Windows and Charge Port Door covers with the car name, once per change:

          ```text
          [Szarik] Charge Port Door: OPEN
          [Szarik] Charge Port Latch: UNLOCKED
          ```

          Library unchanged: [darek-margas/tesla-ble](https://github.com/darek-margas/tesla-ble) `v5.2.0`.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "ESPHome Tesla BLE multi-car $TAG" \
              --notes-file /tmp/release-notes.md
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "ESPHome Tesla BLE multi-car $TAG" \
              --notes-file /tmp/release-notes.md
          fi
