name: Release multi-car

on:
  push:
    branches:
      - multicar-v2
    paths:
      - VERSION
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout multicar-v2
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0
        with:
          ref: multicar-v2
          fetch-depth: 0

      - name: Run unit tests
        run: make test

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          test -n "$VERSION"
          TAG="v$VERSION"

          cat > /tmp/release-notes.md <<'EOF'
          ## More vehicle data, scheduled charging control, km units

          Most of what the car already sends in the polls we make was decoded by the library and then thrown away. This release exposes it in Home Assistant, adds a scheduled-charging control, and fixes a few states that went stale. No extra BLE traffic: all new values come from polls that already ran.

          ### Units: kilometres
          Range, Odometer, Charging Rate (and the new range and speed-limit sensors) are now in **km** / **km/h** instead of miles / mph. Home Assistant will ask about the unit change on existing sensors and their statistics - that is expected.

          ### New sensors
          - **Charging:** Usable Battery, Time to Charge Limit, Range Added (this session), Scheduled Charging Mode, Scheduled Charging Pending, Scheduled Departure Time. Estimated Range and Ideal Range are added disabled by default.
          - **Climate:** Preconditioning, Front / Rear Defroster, Battery Heater, Battery Heater No Power, Passenger Temperature Setting, Steering Wheel Heat Level, Seat Heater Front Left / Right (rear seats disabled by default).
          - **Closures and modes:** Speed Limit Mode, Speed Limit, Sentry Mode Available (diagnostic, disabled by default).
          - **Tyres:** low-pressure warning per wheel (soft warnings disabled by default).

          A sensor that stays "unknown" means that car does not send that field over BLE.

          ### Scheduled charging control
          - **Scheduled Charging Start** (time picker): sets "start charging at" and turns scheduled charging on.
          - **Scheduled Charging** (switch): turns it on or off, keeping the car's time.

          Both are read back from the car; after each change the charge state is re-read, so a change the car did not accept snaps back.

          ### Fixes and behaviour changes
          - **Doors, frunk and trunk stay current while the car sleeps.** VCSEC reports every closure on each status poll, also while asleep, but only the charge port was used. Doors, frunk and trunk now follow it too. Covers publish only on change (fewer state updates).
          - **Climate entity shows what the car really has.** The preset (Normal / Keep On / Dog / Camp / Defrost) and Bioweapon fan mode were write-only; they are now read back from the car.
          - **Climate turned on from the Tesla app shows up.** After the 11 min idle window an idle car was re-read only every 11 min, so climate started from the app stayed OFF in Home Assistant. Climate running now counts as active (fast polling - the car cannot sleep with HVAC on anyway), and when a car is seen waking up its state is read once right away (at most once per 15 min, so self-wake blips do not keep it awake). The log shows what the car reports for climate when it changes (`Climate reported: ...`).
          - **Charger Phases and Charger Power Estimated keep the last session's values** after charging stops or the cable is unplugged, and survive a reboot (saved to flash once per charging session, only if changed). Before, the estimate dropped to 0 on unplug and both were unknown after a reboot.

          ### Other
          - README log examples use generic car names.
          - Library unchanged: [darek-margas/tesla-ble](https://github.com/darek-margas/tesla-ble) `v5.2.0`. See v2026.10.0 for the multi-car design.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "ESPHome Tesla BLE multi-car $TAG" \
              --notes-file /tmp/release-notes.md
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "ESPHome Tesla BLE multi-car $TAG" \
              --notes-file /tmp/release-notes.md
          fi
