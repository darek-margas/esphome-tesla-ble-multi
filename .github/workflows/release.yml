name: Release multi-car

on:
  push:
    branches:
      - multicar-v2
    paths:
      - VERSION
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout multicar-v2
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0
        with:
          ref: multicar-v2
          fetch-depth: 0

      - name: Run unit tests
        run: make test

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          test -n "$VERSION"
          TAG="v$VERSION"

          cat > /tmp/release-notes.md <<'EOF'
          ## Smarter icons and README screenshots

          Small follow-up to v2026.10.4: icons and documentation only. No change to the BLE link, polling or what is read from the cars.

          ### Icons
          - **TPMS pressure sensors:** plain tyre (`mdi:tire`) instead of the tyre-with-alert icon, which looked like a warning even with correct pressure. The alert tyre stays on the TPMS warning sensors.
          - **Battery Heater:** heating element (`mdi:heating-coil`) instead of the battery-health icon.
          - **Estimated Range / Ideal Range:** their own icons (`mdi:map-marker-path`, `mdi:map-marker-check`), so they are told apart from Range.

          Icons show on enabled entities; Home Assistant's list of disabled/hidden entities shows its status marker instead.

          ### README
          - A small preview next to the intro shows a car in Home Assistant (controls, sensors, diagnostics, devices); it links to the full-size screenshots.
          - Current screenshots in their sections: one device per car under the ESP32 node (*Home Assistant sub-devices*), a car's controls, sensors and diagnostics (*A car in Home Assistant*), the ESP32 node page (*Parent device controls*, MAC blurred) and the pairing request on the car screen (*Pairing*).
          - The outdated screenshots from the original single-car project are removed.

          Library unchanged: [darek-margas/tesla-ble](https://github.com/darek-margas/tesla-ble) `v5.2.0`.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "ESPHome Tesla BLE multi-car $TAG" \
              --notes-file /tmp/release-notes.md
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "ESPHome Tesla BLE multi-car $TAG" \
              --notes-file /tmp/release-notes.md
          fi
