name: Release multi-car

on:
  push:
    branches:
      - multicar-v2
    paths:
      - VERSION
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout multicar-v2
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0
        with:
          ref: multicar-v2
          fetch-depth: 0

      - name: Run unit tests
        run: make test

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          test -n "$VERSION"
          TAG="v$VERSION"

          cat > /tmp/release-notes.md <<'EOF'
          ## Build the Tesla BLE library from our own fork

          No functional change: the library code is identical to v2026.10.0 (only its download source changed).

          The Tesla BLE library is now fetched from [darek-margas/tesla-ble](https://github.com/darek-margas/tesla-ble), a fork of [yoziru/tesla-ble](https://github.com/yoziru/tesla-ble), pinned at `v5.2.0` (the same commit as upstream `v5.2.0`).

          Why: this component depends closely on the library's behaviour (command queue, session handling, retry timers). Building straight from upstream means an upstream change can break this build, or change runtime behaviour, without warning. With the fork, upstream releases are synced in deliberately: sync the fork, test, then move the `ref:` here to the new tag. Until then the build stays on the tested `v5.2.0`. The fork is also the place for library fixes this project may need later, without vendoring the library into this repo.

          If your own YAML declares the `tesla-ble` framework component itself (instead of using `packages/board.yml`), update it too:

          ```yaml
          esp32:
            framework:
              components:
                - name: tesla-ble
                  source: https://github.com/darek-margas/tesla-ble.git
                  ref: v5.2.0
          ```

          See v2026.10.0 for the multi-car changes (one BLE link at a time, presence, queued commands, sleep-friendly polling).
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "ESPHome Tesla BLE multi-car $TAG" \
              --notes-file /tmp/release-notes.md
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "ESPHome Tesla BLE multi-car $TAG" \
              --notes-file /tmp/release-notes.md
          fi
