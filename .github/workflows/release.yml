name: Release multi-car

on:
  push:
    branches:
      - multicar-v2
    paths:
      - VERSION
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout multicar-v2
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0
        with:
          ref: multicar-v2
          fetch-depth: 0

      - name: Run unit tests
        run: make test

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          test -n "$VERSION"
          TAG="v$VERSION"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi

          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "ESPHome Tesla BLE multi-car $TAG" \
            --notes "Multi-car release from multicar-v2: multiple Teslas per ESP32, per-VIN keys and sessions, Home Assistant sub-devices, independent pairing, CLOUD_KEY enrolment, and serialized BLE GATT writes."
