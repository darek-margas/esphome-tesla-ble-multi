name: Release multi-car

on:
  push:
    branches:
      - multicar-v2
    paths:
      - VERSION
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout multicar-v2
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0
        with:
          ref: multicar-v2
          fetch-depth: 0

      - name: Run unit tests
        run: make test

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          test -n "$VERSION"
          TAG="v$VERSION"

          cat > /tmp/release-notes.md <<'EOF'
          ## Reliable multi-car: one BLE link at a time

          The first multi-car release kept a permanent BLE connection to every car. In real use that was not reliable: one car worked while the other kept losing data, and which car suffered changed from boot to boot.

          Digging through the logs showed several independent problems:

          - **Error 143 was mishandled.** ESP-IDF returns `ESP_GATT_CONGESTED` (143) for a write it *accepted* while the link is congested. The adapter treated it as a failure and resent the fragment, duplicating bytes inside the Tesla frame and corrupting the message. It is now treated as sent, and only that link pauses until the congestion clears.
          - **The library's 1 s resend timer.** Fragments were paced 60 ms apart, so a 188-byte request took longer than one second to leave the ESP32 and the library resent it before the car had seen it. Answers to the first copy were then rejected ("response for a different request") and partial replies were thrown away. The gap is now 5 ms.
          - **Two simultaneous links do not work on the classic ESP32.** With two Tesla connections up, the controller stops serving the first-opened link (HCI handle 0) and it times out (`rsn 0x8`) every 10-20 seconds, whichever car holds it and whatever the connection parameters. Each car on its own was completely stable.

          So the cars now take turns on the radio:

          - only one car is connected at a time; the car holding the link keeps it until another car has work waiting, then hands over after 1 s of quiet
          - a hand-over takes about 1 s: the GATT service table is cached in NVS, and the Tesla VCSEC and infotainment sessions are kept across turns
          - commands for a car that is not connected are queued and sent on its turn - typically 1.5-2 s in total
          - presence from BLE adverts: a car that is not in range never takes the link from the car that is home; new `Present` binary sensor per car
          - sleep-friendly: connecting never wakes a car, background polls never wake a sleeping car, each car is woken once after boot to fill its sensors (`wake_on_boot`)
          - commands for a sleeping car wake it first and wait for infotainment before sending; a command that fails on a temporary link/session error is retried once
          - every log line carries the car name, and each Tesla message logs how long it took to leave the ESP32

          New per-car options: `wake_on_boot`, `connection_interval`, `supervision_timeout` (all optional). New diagnostic sensors `BLE RSSI` and `BLE Advert RSSI` (disabled by default).

          Recommended polling for two cars: `vcsec_poll_interval: 60`, `infotainment_poll_interval_awake: 120`, `infotainment_poll_interval_active: 60`, `infotainment_sleep_timeout: 660`. Keep the BLE tracker scan window short (`interval: 320ms`, `window: 30ms`, `active: false`, `continuous: true`).

          Tested with two Teslas on a classic ESP32, ESPHome 2026.9.x and Tesla BLE library v5.2.0: no link drops, about 1 s hand-overs, commands to either car in about 2 s.

          The main branch remains reserved for tracking upstream yoziru/esphome-tesla-ble changes. Multi-car development and releases come from multicar-v2.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "ESPHome Tesla BLE multi-car $TAG" \
              --notes-file /tmp/release-notes.md
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "ESPHome Tesla BLE multi-car $TAG" \
              --notes-file /tmp/release-notes.md
          fi
