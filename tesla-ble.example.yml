substitutions:
  # all substitutions for this project
  friendly_name: Tesla BLE
  device_name: tesla-ble
  device_description: Tesla BLE
  board: esp32dev
  variant: esp32
  flash_size: 4MB
  tesla_vehicle_name: "Tesla"
  ble_mac_address: "A0:B1:C2:D3:E4:F5" # vehicle BLE MAC address
  tesla_vin: "5YJ30123456789ABC" # vehicle VIN

  # Polling intervals (in seconds) - customize based on your needs
  # Lower values = more responsive but higher battery drain
  # Higher values = less battery drain but slower updates
  vcsec_poll_interval: "10"                    # Vehicle status (range: 5-300s, default: 10s)
  infotainment_poll_interval_awake: "30"       # Data when awake (range: 10-600s, default: 30s)
  infotainment_poll_interval_active: "10"      # Data when active (range: 5-120s, default: 10s)
  infotainment_sleep_timeout: "660"            # Sleep timeout (range: 60-3600s, default: 11min)

external_components:
  - source:
      type: git
      url: https://github.com/darek-margas/esphome-tesla-ble-multi.git
      ref: multicar-v2          # or a release tag such as v2026.10.6
      path: components
    components: [tesla_ble_vehicle, tesla_ble_listener]

packages:
  base: !include packages/base.yml
  client: !include packages/client.yml


# Multi-car users define vehicles directly instead of using packages/client.yml.
# Only one car is connected at a time; the cars take turns on the BLE radio
# (see README "How it works"). Recommended polling for two cars:
#
# esp32_ble_tracker:
#   scan_parameters:
#     interval: 320ms
#     window: 30ms
#     active: false
#     continuous: true          # required: finds cars and detects presence
#
# tesla_ble_vehicle:
#   - id: car_one
#     name: Car One
#     vin: !secret tesla_vin_car_one
#     ble_mac_address: !secret ble_mac_address_car_one
#     vcsec_poll_interval: "60"               # also how often this car asks for a BLE turn
#     infotainment_poll_interval_awake: "120"
#     infotainment_poll_interval_active: "60"
#     infotainment_sleep_timeout: "660"
#     wake_on_boot: true              # per car: wake it once after the ESP32 boots to fill sensors
#     # Optional, shown with their defaults:
#     # presence_timeout: 5min      # Present turns to away after this long without the car (1min - 1h)
#     # connection_interval: 15ms   # BLE link interval, same for every car
#     # supervision_timeout: 6s     # BLE link timeout
#   - id: car_two
#     name: Car Two
#     vin: !secret tesla_vin_car_two
#     ble_mac_address: !secret ble_mac_address_car_two
#     wake_on_boot: false             # e.g. a car you rarely use: do not wake it on every ESP32 reboot
#     vcsec_poll_interval: "60"
#     infotainment_poll_interval_awake: "120"
#     infotainment_poll_interval_active: "60"
#     infotainment_sleep_timeout: "660"
