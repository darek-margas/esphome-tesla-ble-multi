esp32:
  board: $board
  variant: $variant
  flash_size: $flash_size
  # framework type defaults to esp-idf (only the managed components list
  # below needs the block to exist).
  framework:
    components:
      - name: tesla-ble
        source: https://github.com/darek-margas/esphome-tesla-ble-multi.git
        ref: multicar-v2
        path: tesla-ble-patched
