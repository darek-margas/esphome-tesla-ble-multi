esp32:
  board: $board
  variant: $variant
  flash_size: $flash_size
  # framework type defaults to esp-idf (only the managed components list
  # below needs the block to exist).
  framework:
    components:
      - name: tesla-ble
        source: https://github.com/darek-margas/tesla-ble.git
        ref: v2026.10.14  # our library: v5.2.0 + low power, keep accessory power, guest mode, overheat temperature, scheduled departure, media, wake fix, crash fix, log level, verified responses, upstream session/buffer/key fixes, pending command count, stricter sessions (roll back: v2026.10.13)
