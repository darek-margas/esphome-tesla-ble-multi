substitutions:
  board: esp32dev
  variant: esp32
  flash_size: 4MB

esphome:
  name: tesla-ble-listener-test
  friendly_name: Tesla BLE Listener Test

esp32:
  board: $board
  variant: $variant
  flash_size: $flash_size
  framework:
    components:
      - name: tesla-ble
        source: https://github.com/darek-margas/tesla-ble.git
        ref: v5.2.0-dm.1  # our fork: v5.2.0 + low power, keep accessory power, guest mode, overheat temperature (roll back: v5.2.0)

logger:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

esp32_ble_tracker:

external_components:
  - source: components
    components: [tesla_ble_vehicle, tesla_ble_listener]

tesla_ble_listener:
  vin: "5YJ30123456789ABC"
