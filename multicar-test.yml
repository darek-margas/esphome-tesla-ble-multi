substitutions:
  board: esp32dev
  variant: esp32
  flash_size: 4MB

esphome:
  name: tesla-ble-multicar-test
  friendly_name: Tesla BLE Multicar Test

esp32:
  board: $board
  variant: $variant
  flash_size: $flash_size
  framework:
    components:
      - name: tesla-ble
        source: https://github.com/darek-margas/tesla-ble.git
        ref: v5.2.0-dm.7  # our fork: v5.2.0 + low power, keep accessory power, guest mode, overheat temperature, scheduled departure, media, wake fix, crash fix, log level (roll back: v5.2.0-dm.6)

logger:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

esp32_ble_tracker:

external_components:
  - source: components
    components: [tesla_ble_vehicle, tesla_ble_listener]

tesla_ble_vehicle:
  - id: car_one
    name: Car One
    vin: "5YJ30123456789ABC"
    ble_mac_address: "A0:B1:C2:D3:E4:F5"
    vcsec_poll_interval: 60
    wake_on_boot: false
    connection_interval: 15ms
    supervision_timeout: 6s
  - id: car_two
    name: Car Two
    vin: "5YJ30123456789ABD"
    ble_mac_address: "A0:B1:C2:D3:E4:F6"
